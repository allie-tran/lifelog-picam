[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Default run is unit-only (offline, no Postgres/Mongo/Redis). Integration tests
# are marked `integration` and excluded here; opt in with an explicit marker:
#   pytest -m integration      # run only the integration suite
#   pytest -m ""               # run everything
addopts = -ra -q -m "not integration"
markers =
    integration: test requires real external services (DB/Redis/network)
