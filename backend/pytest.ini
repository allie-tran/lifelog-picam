[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
# Unit tests must not touch Postgres/Mongo/Redis/Celery/LLM. Anything needing
# real infra should be marked `integration` and is deselected by default:
#   pytest -m integration   # to run them explicitly
markers =
    integration: test requires real external services (DB/Redis/network)
